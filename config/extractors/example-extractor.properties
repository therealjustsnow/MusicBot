# Example custom extractor definition for MusicBot.
# Rename this file (remove "example-" prefix) and fill in the fields below
# to create your own extractor.
#
# The extractor name is taken from the file name (without .properties).
# For example, "my-site.properties" creates extractor "custom:my-site".
#
# Variables available in commands:
#   {url}         - the URL being extracted
#   {audio_cache} - absolute path to the bot's audio cache folder
#
# The script must write a JSON object to stdout.
# See the bot documentation or claudeprompt.md for the full response format.

# Command to run on Windows systems.
windows_command = python example_script.py --url {url} --cache {audio_cache}

# Command to run on Unix/Linux/macOS systems.
unix_command = python3 example_script.py --url {url} --cache {audio_cache}

# Regular expression that matches URLs this extractor handles.
# The first extractor whose regex matches a URL wins.
url_regex = https?://example\.com/.*
